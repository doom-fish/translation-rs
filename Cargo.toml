[package]
name = "translation-rs"
version = "0.2.0"
edition = "2021"
autotests = false
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/translation-rs"
repository = "https://github.com/doom-fish/translation-rs"
description = "Safe Rust bindings for Translation.framework — language availability, session workflows, and language recognition on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["translation", "ai", "macos", "nlp", "apple"]
categories = ["api-bindings", "os::macos-apis", "text-processing"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "COVERAGE.md",
    "LICENSE-*",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "translation"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[test]]
name = "api_coverage"
path = "tests/api_coverage.rs"
harness = false

[[test]]
name = "language_tests"
path = "tests/language_tests.rs"
harness = false

[[test]]
name = "language_pair_tests"
path = "tests/language_pair_tests.rs"
harness = false

[[test]]
name = "translation_configuration_tests"
path = "tests/translation_configuration_tests.rs"
harness = false

[[test]]
name = "translation_response_tests"
path = "tests/translation_response_tests.rs"
harness = false

[[test]]
name = "language_recognition_tests"
path = "tests/language_recognition_tests.rs"
harness = false

[[test]]
name = "language_availability_tests"
path = "tests/language_availability_tests.rs"
harness = false

[[test]]
name = "translation_error_tests"
path = "tests/translation_error_tests.rs"
harness = false

[[test]]
name = "translation_session_tests"
path = "tests/translation_session_tests.rs"
harness = false

[profile.release]
debug = "full"
strip = "none"
